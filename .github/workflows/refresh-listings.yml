# ═══════════════════════════════════════════════
# TOBAGO PROPERTY FINDER — Daily Listings Refresh
# Place this file at: .github/workflows/refresh-listings.yml
#
# Runs TWICE daily with alternating search groups so the
# search-based sites each get fresh quota instead of
# starving at the back of one big queue. Crawl sites run
# every time. The repo MERGES, so both runs accumulate.
# ═══════════════════════════════════════════════
name: Refresh Tobago Listings

on:
  schedule:
    # Group A — 10:00 UTC (6 AM Tobago): caribbeanMLS, seajade, villas
    - cron: '0 10 * * *'
    # Group B — 14:00 UTC (10 AM Tobago): pin.tt, terracaribbean
    - cron: '0 14 * * *'
  workflow_dispatch:
    inputs:
      group:
        description: 'Search group to run (A, B, or all)'
        required: false
        default: 'all'

permissions:
  contents: write

# Serialize runs so two refreshes never race to push main. Racing runs were
# producing a textually MERGED repo.json (clean meta stapled onto a dirty
# listings array) because git line-merges the big JSON file.
concurrency:
  group: refresh-listings
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Determine run group
        id: group
        run: |
          # Manual run -> use the dropdown input. Scheduled run -> pick by cron time.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "RUN_GROUP=${{ github.event.inputs.group }}" >> "$GITHUB_ENV"
          elif [ "${{ github.event.schedule }}" = "0 14 * * *" ]; then
            echo "RUN_GROUP=B" >> "$GITHUB_ENV"
          else
            echo "RUN_GROUP=A" >> "$GITHUB_ENV"
          fi
          echo "Selected group: $RUN_GROUP"

      - name: Check secret is configured
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY secret is NOT set. Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "Secret found"

      - name: Run refresh script
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RUN_GROUP: ${{ env.RUN_GROUP }}
        run: node refresh.js

      - name: Commit updated repo.json
        run: |
          git config user.name "repo-refresher"
          git config user.email "actions@github.com"
          git add data/repo.json data/sold.json
          if git diff --staged --quiet; then echo "No changes to commit"; exit 0; fi
          # The generated JSON files are authoritative: refresh.js already
          # merged the previous repo.json at read-time. NEVER let git
          # textually merge them — keep a pristine copy and restore it after
          # any rebase so we push the whole file, not a line-merged hybrid.
          cp data/repo.json /tmp/repo.json
          cp data/sold.json /tmp/sold.json
          git commit -m "Listings refresh (group ${RUN_GROUP}) $(date -u +%Y-%m-%dT%H:%M)"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main || {
              git checkout --theirs -- data/repo.json data/sold.json 2>/dev/null || true
              git add data/repo.json data/sold.json
              GIT_EDITOR=true git rebase --continue || git rebase --abort
            }
            cp /tmp/repo.json data/repo.json
            cp /tmp/sold.json data/sold.json
            git add data/repo.json data/sold.json
            git diff --staged --quiet || git commit --amend --no-edit
            if git push origin main; then echo "Pushed on attempt $attempt"; exit 0; fi
            sleep $((RANDOM % 8 + 3))
          done
          echo "::error::push failed after 5 attempts"; exit 1
        env:
          RUN_GROUP: ${{ env.RUN_GROUP }}
