# ═══════════════════════════════════════════════
# TOBAGO PROPERTY FINDER — Daily Listings Refresh
# Place this file at: .github/workflows/refresh-listings.yml
# ═══════════════════════════════════════════════
name: Refresh Tobago Listings

on:
  schedule:
    # Runs daily at 10:00 UTC (6:00 AM Tobago time)
    - cron: '0 10 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Check secret is configured
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY secret is NOT set. Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "Secret found"

      - name: Run refresh script
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node refresh.js

      - name: Commit updated repo.json
        run: |
          git config user.name "repo-refresher"
          git config user.email "actions@github.com"
          git add data/repo.json
          git diff --staged --quiet || git commit -m "Daily listings refresh $(date -u +%Y-%m-%d)"
          # Pull any commits made while we were running, keeping OUR fresh repo.json on conflict
          git pull --rebase -X theirs origin main
          git push

